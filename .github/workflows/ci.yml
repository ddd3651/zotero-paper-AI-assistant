name: Test and package source

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m unittest discover -s test -p '*_test.py'
      - run: npm run build
      - run: npm run check:publish
      - run: npm run pack:source
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-paper-chat-source-${{ matrix.os }}
          path: dist/*-source.zip

  windows-zotero-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - name: Real Zotero desktop with synthetic PDF and local mock model
        shell: pwsh
        run: ./scripts/smoke/windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-zotero-smoke-evidence
          path: dist/smoke-evidence/
          retention-days: 7

  macos-zotero-smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - name: Real macOS Zotero with isolated profile and mock model
        run: python scripts/smoke/macos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-zotero-smoke-evidence
          path: dist/macos-smoke-evidence/
          retention-days: 7
