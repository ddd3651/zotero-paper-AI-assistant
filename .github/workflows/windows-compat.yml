name: Windows compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PAPER_CHAT_DATA_DIR: ${{ runner.temp }}/paper-chat-user-data

jobs:
  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: npm test
      - name: Packaging tests
        run: python -m unittest discover -s test -p '*_test.py'
      - run: npm run build
      - run: npm run check:publish
      - run: npm run pack:source
      - name: Real Windows Zotero with synthetic PDF and local mock model
        shell: pwsh
        run: ./scripts/smoke/windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-compatibility-evidence
          path: dist/smoke-evidence/
          retention-days: 7
